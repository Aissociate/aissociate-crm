# Traduction de public/_redirects (Netlify) pour Nginx.
# Netlify ignore le slash final au matching : les regex acceptent "/?".
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml application/manifest+json;
    gzip_min_length 1024;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Sitemap dynamique : rewrite 200 = proxy vers la fonction Supabase
    location = /sitemap-blog.xml {
        proxy_pass https://vkirutbpxzybucuiyjnb.supabase.co/functions/v1/sitemap-blog;
        proxy_ssl_server_name on;
        proxy_set_header Host vkirutbpxzybucuiyjnb.supabase.co;
    }

    # ── URLs fantômes des anciennes versions (301) ──
    location ~ ^/rh(/.*)?$      { return 301 /formations/ia-ressources-humaines/; }
    location ~ ^/ventes(/.*)?$  { return 301 /formations/ia-prospection-commerciale/; }
    location ~ ^/formation/?$   { return 301 /formations/; }
    location ~ ^/home(/.*)?$    { return 301 /; }

    # ── Articles fusionnés (301) ──
    location ~ ^/blog/l-ia-generative-au-service-des-pme-guide-complet-pour-booster-votre-entreprise-a/?$ { return 301 /blog/l-ia-generative-au-service-des-pme-reunionnaises-guide-pratique-2026/; }
    location ~ ^/blog/l-ia-generative-au-service-des-pme-le-guide-pratique-pour-passer-a-l-action-en-2/?$ { return 301 /blog/l-ia-generative-au-service-des-pme-reunionnaises-guide-pratique-2026/; }
    location ~ ^/blog/l-ia-generative-au-service-des-pme-en-2026-guide-pratique-pour-les-dirigeants-re/?$ { return 301 /blog/l-ia-generative-au-service-des-pme-reunionnaises-guide-pratique-2026/; }
    location ~ ^/blog/l-ia-generative-au-service-des-pme-reunionnaises-guide-pratique-pour-passer-a-l-/?$ { return 301 /blog/l-ia-generative-au-service-des-pme-reunionnaises-guide-pratique-2026/; }
    location ~ ^/blog/poppy-l-ia-generative-de-californie-ce-que-les-pme-reunionnaises-peuvent-en-rete/?$ { return 301 /blog/poppy-l-ia-generative-de-californie-4-lecons-que-les-pme-reunionnaises-doivent-r/; }
    location ~ ^/blog/godot-ferme-la-porte-au-code-ia-ce-que-cette-decision-revele-aux-pme-sur-l-usage/?$ { return 301 /blog/godot-refuse-le-code-genere-par-l-ia-ce-que-les-dirigeants-de-pme-doivent-en-ret/; }
    location ~ ^/blog/fonds-souverain-de-l-ia-ce-que-la-proposition-d-openai-change-pour-les-pme/?$ { return 301 /blog/fonds-souverain-de-l-ia-la-proposition-d-altman-et-ce-qu-elle-change-pour-les-pm/; }
    location ~ ^/blog/souverainete-ia-quand-le-portugal-montre-l-exemple-avec-amalia-et-que-la-france-/?$ { return 301 /blog/souverainete-ia-quand-le-portugal-livre-amalia-et-interroge-la-strategie-francai/; }
    location ~ ^/blog/fable-5-retabli-mais-le-risque-de-dependance-aux-modeles-americains-reste-entier/?$ { return 301 /blog/fable-5-retabli-pourquoi-les-pme-reunionnaises-doivent-anticiper-le-risque-de-de/; }
    location ~ ^/blog/anthropic-capte-un-tiers-du-capital-risque-ia-mondial-pourquoi-les-pme-reunionna/?$ { return 301 /blog/anthropic-capte-un-tiers-du-capital-risque-mondial-ce-que-ca-change-concretement/; }
    location ~ ^/blog/ia-et-emploi-pourquoi-la-note-du-tresor-de-juin-2026-doit-alerter-les-dirigeants/?$ { return 301 /blog/ia-et-emploi-a-la-reunion-ce-que-la-note-du-tresor-change-pour-les-dirigeants-de/; }
    location ~ ^/blog/crawlers-ia-pourquoi-le-site-de-votre-pme-est-aspire-et-ce-que-ca-vous-coute-vra/?$ { return 301 /blog/crawlers-ia-ce-que-les-106-millions-de-requetes-de-claudebot-revelent-aux-dirige/; }
    location ~ ^/blog/veille-ia-juillet-2026-gpt-5-6-agents-autonomes-et-visibilite-des-pme-ce-que-les/?$ { return 301 /blog/veille-ia-juillet-2026-les-4-tendances-qui-vont-bouleverser-votre-entreprise-reu/; }
    location ~ ^/blog/veille-ia-2026-les-tendances-incontournables-pour-les-pme-reunionnaises/?$ { return 301 /blog/veille-ia-2026-les-tendances-qui-redessinent-le-quotidien-des-pme-reunionnaises/; }
    location ~ ^/blog/chatgpt-suspendu-par-la-justice-ce-que-cet-arret-change-pour-votre-pme-reunionna/?$ { return 301 /blog/ia-en-entreprise-la-justice-suspend-chatgpt-sans-consultation-du-cse-ce-que-les-/; }
    location ~ ^/blog/ia-et-relation-client-en-pme-comment-transformer-chaque-interaction-en-levier-de/?$ { return 301 /blog/ia-et-relation-client-comment-les-pme-reunionnaises-peuvent-transformer-leur-exp/; }
    location ~ ^/blog/prompt-engineering-les-bases-essentielles-pour-demarrer-avec-l-ia-en-2026/?$ { return 301 /blog/prompt-engineering-les-bases-pour-debuter-en-entreprise-a-la-reunion/; }
    location ~ ^/blog/automatiser-ses-processus-metier-avec-l-ia-le-guide-pratique-pour-les-pme-en-202/?$ { return 301 /blog/automatiser-ses-processus-metier-avec-l-ia-guide-complet-pour-les-pme-en-2026/; }
    location ~ ^/blog/ia-en-entreprise-pourquoi-l-exploitation-des-agents-devient-le-vrai-enjeu-pour-l/?$ { return 301 /blog/ia-en-entreprise-pourquoi-le-vrai-defi-n-est-plus-le-modele-mais-l-exploitation/; }
    location ~ ^/blog/jumeaux-numeriques-en-2026-quand-l-ia-transforme-les-infrastructures-critiques-e/?$ { return 301 /blog/jumeaux-numeriques-et-ia-ce-que-les-infrastructures-critiques-enseignent-aux-pme/; }
    location ~ ^/blog/pharmacy-forward-comment-un-investissement-ia-de-100-m-inspire-les-pme-reunionna/?$ { return 301 /blog/evernorth-investit-100-m-en-ia-pharmaceutique-ce-que-les-pme-reunionnaises-peuve/; }

    # ── Pages supprimées : 410 Gone, corps = l'application (page 404) ──
    error_page 410 /index.html;
    location ~* ^/guideia2026(/.*)?$ { return 410; }

    # Assets fingerprintés : cache long
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # URL sans slash final : fichier réel, sinon -> @noslash.
    location ~ [^/]$ {
        add_header Cache-Control "no-cache";
        try_files $uri @noslash;
    }
    # Comme Netlify : /formations -> 301 /formations/ quand la page prérendue
    # existe (les canonicals sont écrits avec le slash), sinon fallback SPA.
    location @noslash {
        add_header Cache-Control "no-cache";
        if (-f $request_filename/index.html) { return 301 $uri/$is_args$args; }
        rewrite ^ /index.html break;
    }

    # URL avec slash final : page prérendue, sinon fallback SPA.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html /index.html;
    }
}
