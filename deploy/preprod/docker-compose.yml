# Préprod du site + CRM, branchée sur la nouvelle pile (API maison) — /opt/aissociate-preprod
# Conteneur séparé de la production ; priorité Traefik plus haute pour prendre
# preprod.aissociate.re sans modifier le conteneur de production.
# Variables (/opt/aissociate-preprod/.env) : VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY
services:
  web:
    build:
      context: ./src
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        API_HOST: api.aissociate.re
    image: aissociate-web-preprod:latest
    container_name: aissociate-web-preprod
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.aissociate-preprod.rule=Host(`preprod.aissociate.re`)
      - traefik.http.routers.aissociate-preprod.priority=1000
      - traefik.http.routers.aissociate-preprod.entrypoints=websecure
      - traefik.http.routers.aissociate-preprod.tls.certresolver=ledns
      - traefik.http.routers.aissociate-preprod.middlewares=aissociate-preprod-headers
      - traefik.http.services.aissociate-preprod.loadbalancer.server.port=80
      # Jamais indexée par les moteurs de recherche.
      - traefik.http.middlewares.aissociate-preprod-headers.headers.customResponseHeaders.X-Robots-Tag=noindex, nofollow
      - traefik.http.middlewares.aissociate-preprod-headers.headers.stsSeconds=31536000

networks:
  proxy:
    name: proxy
    external: true
