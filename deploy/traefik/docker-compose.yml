# Reverse proxy Traefik (partagé par toutes les apps du VPS) — /opt/traefik
services:
  traefik:
    image: traefik:v3.6
    container_name: traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=proxy
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
      # DNS-01 via l'API Gandi : certificats obtenus sans dépendre de l'IP publiée
      - --certificatesresolvers.ledns.acme.dnschallenge=true
      - --certificatesresolvers.ledns.acme.dnschallenge.provider=gandiv5
      - --certificatesresolvers.ledns.acme.dnschallenge.resolvers=ns-11-b.gandi.net:53,ns-192-c.gandi.net:53
      - --certificatesresolvers.ledns.acme.storage=/letsencrypt/acme-dns.json
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "80:80"
      - "443:443"
    env_file: .env   # GANDIV5_PERSONAL_ACCESS_TOKEN=...
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - proxy

networks:
  proxy:
    name: proxy
    external: true
