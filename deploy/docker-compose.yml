# Site aissociate.re sur le VPS, derrière Traefik (deploy/traefik).
# Lancé par deploy/deploy.sh avec : -p aissociate --env-file /opt/aissociate/.env
# Variables (/opt/aissociate/.env) :
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY  (publiques, injectées au build)
#   SITE_HOSTS = Host(`aissociate.re`) || Host(`www.aissociate.re`) || Host(`preprod.aissociate.re`)
services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: aissociate-web:latest
    container_name: aissociate-web
    restart: unless-stopped
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.aissociate.rule=${SITE_HOSTS}
      - traefik.http.routers.aissociate.entrypoints=websecure
      - traefik.http.routers.aissociate.tls.certresolver=ledns
      - traefik.http.routers.aissociate.middlewares=aissociate-www,aissociate-headers
      - traefik.http.services.aissociate.loadbalancer.server.port=80
      # www -> apex (comme Netlify)
      - traefik.http.middlewares.aissociate-www.redirectregex.regex=^https://www\.aissociate\.re/(.*)
      - traefik.http.middlewares.aissociate-www.redirectregex.replacement=https://aissociate.re/$${1}
      - traefik.http.middlewares.aissociate-www.redirectregex.permanent=true
      - traefik.http.middlewares.aissociate-headers.headers.stsSeconds=31536000
      - traefik.http.middlewares.aissociate-headers.headers.contentTypeNosniff=true
      - traefik.http.middlewares.aissociate-headers.headers.referrerPolicy=strict-origin-when-cross-origin

networks:
  proxy:
    name: proxy
    external: true
